# Model routing for the ScieFlow experiments module — which model tier runs which workflow phase.
# Consumed by agents via skills/model-routing/SKILL.md. Prices are indicative.
as_of: "2026-07-05"
refresh_rule: >
  Re-verify prices (provider pricing pages / web search) when as_of is older
  than 3 months, or before a campaign expected to cost more than a few dollars.
  Update models, prices, and as_of together.

tiers:
  high:
    purpose: Judgment work — wrong answers are expensive.
    models:
      claude: {model: claude-opus-4-8, usd_per_mtok_in: 5.00, usd_per_mtok_out: 25.00}
      codex:  {model: gpt-5.2-codex,   usd_per_mtok_in: 1.75, usd_per_mtok_out: 14.00}
      gemini: {model: gemini-3.1-pro,  usd_per_mtok_in: 2.00, usd_per_mtok_out: 12.00}
      agy:    {model: gemini-3.1-pro,  usd_per_mtok_in: 2.00, usd_per_mtok_out: 12.00}
  standard:
    purpose: Semi-mechanical work — needs competence, not frontier judgment.
    models:
      claude: {model: claude-sonnet-5, usd_per_mtok_in: 3.00, usd_per_mtok_out: 15.00}
      # codex intentionally same as high tier — no mid-tier codex model; the
      # only codex downshift is to codex-mini (cheap).
      codex:  {model: gpt-5.2-codex,   usd_per_mtok_in: 1.75, usd_per_mtok_out: 14.00}
      gemini: {model: gemini-3-flash,  usd_per_mtok_in: 0.50, usd_per_mtok_out: 3.00}
      agy:    {model: gemini-3-flash,  usd_per_mtok_in: 0.50, usd_per_mtok_out: 3.00}
  cheap:
    purpose: Mechanical work fully specified in advance — cheapest capable model.
    models:
      claude: {model: claude-haiku-4-5,      usd_per_mtok_in: 1.00, usd_per_mtok_out: 5.00}
      codex:  {model: gpt-5.2-codex-mini,    usd_per_mtok_in: 0.75, usd_per_mtok_out: 6.00}
      gemini: {model: gemini-3.1-flash-lite, usd_per_mtok_in: 0.25, usd_per_mtok_out: 1.50}
      agy:    {model: gemini-3.1-flash-lite, usd_per_mtok_in: 0.25, usd_per_mtok_out: 1.50}

phases:
  experiment-design: high        # campaign proposals, grid choice, hypotheses
  evaluation: high               # QC interpretation, validation verdicts
  literature: high               # grounding results in publications
  report-writing: high           # final campaign report prose
  campaign-drafting: standard    # writing campaign YAML from an approved plan
  run-debugging: standard        # diagnosing failed runs from logs
  stage-coding: cheap            # implementing stage scripts from a clear spec
  sweep-execution: cheap         # scieflow experiment env build / sweep / compare / report invocations
  scaffolding: cheap             # scieflow experiment new pipeline/stage + template fill-in
  data-generation: cheap         # running/adjusting data generator scripts

delegation:
  claude: "Subagent with explicit model parameter, or: claude --model <model> -p '<task>'"
  codex:  "codex exec -m <model> '<task>'"
  gemini: "gemini -m <model> -p '<task>'"
  agy:    "agy --model <model> '<task>'"
