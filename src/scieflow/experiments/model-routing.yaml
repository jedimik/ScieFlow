# Model routing for the ScieFlow experiments module — which model tier runs which workflow phase.
# Consumed by agents via skills/model-routing/SKILL.md. This file holds no prices,
# no model ids and no dates (M-A-D4): the model and effort come from the role assignment.

tiers:
  high:
    purpose: Judgment work — wrong answers are expensive.
  standard:
    purpose: Semi-mechanical work — needs competence, not frontier judgment.
  cheap:
    purpose: Mechanical work fully specified in advance — cheapest capable model.

phases:
  experiment-design: high        # campaign proposals, grid choice, hypotheses
  evaluation: high               # QC interpretation, validation verdicts
  literature: high               # grounding results in publications
  report-writing: high           # final campaign report prose
  campaign-drafting: standard    # writing campaign YAML from an approved plan
  run-debugging: standard        # diagnosing failed runs from logs
  stage-coding: cheap            # implementing stage scripts from a clear spec
  sweep-execution: cheap         # scieflow experiment env build / sweep / compare / report invocations
  scaffolding: cheap             # scieflow experiment new pipeline/stage + template fill-in
  data-generation: cheap         # running/adjusting data generator scripts

# The model and effort for a phase come from the role assignment:
#   uv run scieflow agent show [--workspace <slug>] --json
resolve: >
  This file maps a phase to a tier only. The model and effort for a phase come
  from the role assignment shown by `scieflow agent show [--workspace <slug>]`.

delegation: "uv run scieflow agent run --role <role> <agent> <prompt> <transcript>"
