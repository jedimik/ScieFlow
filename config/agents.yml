# ScieFlow agent registry — the only place models, commands, and timeouts live.
# Tier routing (AGENTS.md rule 10): primary agents (claude, codex) take
# comprehensive work; support agents (agy) only easy / large-context / paired
# web-search tasks.
# {model}/{reasoning}/{prompt}/{root}/{python} are substituted by
# `scieflow agent run` (src/scieflow/core/agent_run.py).
# 'enabled' and 'tier' are advisory and bind the coordinator: skills dispatch
# only enabled agents, respecting tiers. agent_run does not enforce them;
# the stub is dispatched directly by the test suite.
# Each `menu:` block is what a coordinator presents to the user when settling
# run staffing (research module AGENTS.md, run configuration gate): available
# models, reasoning levels, and how a choice maps to `agent_overrides:` in the
# run's workspace config.yml. `menu:` is read by coordinators, not by code.
agents:
  claude:
    cmd: "claude -p --dangerously-skip-permissions --model {model} {prompt}"
    stdin_cmd: "claude -p --dangerously-skip-permissions --model {model}"
    model: claude-fable-5
    tier: primary
    timeout_min: 30
    enabled: true
    menu:
      provider: "Anthropic — Claude Code CLI"
      models:
        - claude-fable-5        # recommended default
        - claude-opus-5
        - claude-sonnet-5
        - claude-haiku-4-5
      reasoning:
        levels: [default, extended-thinking]
        how: >-
          No CLI reasoning flag; the model choice carries capability. For
          extended thinking, override the whole cmd in agent_overrides, e.g.
          cmd: 'env MAX_THINKING_TOKENS=32000 claude -p
          --dangerously-skip-permissions --model {model} {prompt}'
  codex:
    cmd: "codex exec --sandbox workspace-write --model {model} -c model_reasoning_effort={reasoning} {prompt}"
    model: gpt-6-astra
    reasoning: high
    tier: primary
    timeout_min: 180
    enabled: true
    menu:
      provider: "OpenAI — Codex CLI"
      models:
        - gpt-6-astra           # user-selected default
        - gpt-5.6-sol
      models_note: >-
        Other models depend on the user's Codex account — ask them; set
        `model:` in agent_overrides to switch.
      reasoning:
        levels: [low, medium, high, xhigh, max]   # Astra: high = default
        how: "set `reasoning: <level>` in agent_overrides (fills {reasoning})"
  # User-approved separate profiles: role-specific effort without changing
  # ordinary Codex work. Separate sessions, not independent model families.
  codex-paper:
    cmd: "codex exec --sandbox workspace-write --model {model} -c model_reasoning_effort={reasoning} {prompt}"
    model: gpt-6-astra
    reasoning: xhigh
    tier: primary
    timeout_min: 180
    enabled: true
    menu:
      provider: "OpenAI — Codex CLI (paper writing)"
      models: [gpt-6-astra]
      reasoning:
        levels: [low, medium, high, xhigh, max]
        how: "set `reasoning: <level>` in agent_overrides (fills {reasoning})"
  # Claude's paper-writing profile, paired with codex-paper so the two drafts in
  # paper-draft come from different model families and cross-review each other.
  # Extended thinking is on (Claude has no effort flag; the env prefix is how).
  claude-paper:
    cmd: "env MAX_THINKING_TOKENS=32000 claude -p --dangerously-skip-permissions --model {model} {prompt}"
    stdin_cmd: "env MAX_THINKING_TOKENS=32000 claude -p --dangerously-skip-permissions --model {model}"
    model: claude-fable-5
    tier: primary
    timeout_min: 180
    enabled: true
    menu:
      provider: "Anthropic — Claude Code CLI (paper writing)"
      models:
        - claude-fable-5        # recommended default
        - claude-opus-5
        - claude-sonnet-5
      reasoning:
        levels: [default, extended-thinking]
        how: >-
          Extended thinking is the default here (MAX_THINKING_TOKENS=32000 in
          cmd). For default effort, drop the env prefix from cmd in
          agent_overrides.
  codex-review:
    cmd: "codex exec --sandbox workspace-write --model {model} -c model_reasoning_effort={reasoning} {prompt}"
    model: gpt-6-astra
    reasoning: xhigh
    tier: primary
    timeout_min: 180
    enabled: true
    menu:
      provider: "OpenAI — Codex CLI (review)"
      models: [gpt-6-astra]
      reasoning:
        levels: [low, medium, high, xhigh, max]
        how: "set `reasoning: <level>` in agent_overrides (fills {reasoning})"
  agy:
    cmd: "agy --print {prompt} --model {model} --effort {reasoning} --print-timeout 55m --dangerously-skip-permissions"
    # Piped prompts must not leave --print waiting for a positional value.
    stdin_cmd: "agy --model {model} --effort {reasoning} --print-timeout 55m --dangerously-skip-permissions"
    # Highest Pro-tier Gemini exposed by `agy models` on 2026-09-06.
    # Keep the CLI's inner timeout below the outer timeout_min.
    model: gemini-3.1-pro-high
    reasoning: high
    tier: support
    capabilities: [web-search, large-context]
    timeout_min: 60
    enabled: true
    menu:
      provider: "Google — Antigravity CLI (Gemini)"
      models:
        - gemini-3.1-pro-high   # recommended default
      models_note: >-
        Run `agy models` for what the user's account exposes; set `model:` in
        agent_overrides to switch.
      reasoning:
        how: "set `reasoning:` in agent_overrides (fills --effort {reasoning}); registry default high"
  stub:
    cmd: "{python} -m scieflow.core.stub_agent {prompt}"
    tier: primary            # tests dispatch it into primary-only roles
    timeout_min: 1
    enabled: false            # tests/dry-run only
