# Loop defaults. Per-run overrides live in workspace/<slug>/config.yml.
approval: per-campaign        # per-campaign | autonomous
max_iterations: 5
max_experiment_runs: 40
max_wall_minutes: 240
convergence_window: 2         # stop if this many consecutive iterations show no improvement
low_budget_threshold: 0.10    # checkpoint when any budget dimension drops to <= this fraction
claim_check: ask              # never | ask | approved — verify claims against cited
                              # sources (skills/claim-check/SKILL.md). 'ask' means
                              # the coordinator must ask before the first audit of a
                              # run. Only the user may set 'approved'.
archive: false                # true = push/pull this run as a single zip
                              # (docs/DVC_STORAGE.md, archive mode). Opt in per
                              # run in workspace/<slug>/config.yml once the run
                              # is finished: it trades DVC's per-file dedup for
                              # far fewer S3 objects.

# Research module workflow defaults (src/scieflow/research/AGENTS.md). A run's
# workspace/<slug>/config.yml overrides any of these at top level.
research:
  max_papers: 40
  max_review_rounds: 3
  max_debate_rounds: 2          # perspective debate: discussion rounds after propose
  max_gaps: 10                  # gap-discovery: per-agent cap
  max_hypotheses: 5             # gap-discovery: per-agent cap
  auto_approve_outline: false   # paper-draft: pause for user outline approval
  zotero:
    library: user               # or "group:<id>"

# Which agent performs each dispatched role (catalogue: src/scieflow/core/agent_config.py).
# Fan-out roles take a list. A run inherits these; override per run with
# `scieflow agent configure --workspace <slug>`, which writes only the differences
# to workspace/<slug>/config.yml. Change the defaults with `scieflow agent configure`.
# Support-tier agents (agy) are refused outside support roles, and there only
# alongside a primary agent (AGENTS.md rule 10) — unless a role is listed in
# `support_as_primary:` (here or in a run), an explicit per-role exception set
# with `scieflow agent configure --promote <role>`.
assignments:
  loop.experiment: codex
  loop.literature: codex
  loop.paper-draft: codex-paper
  research.search: [codex, agy]
  research.cross-review: [codex-review]
  research.gap-analysis: [codex]
  research.debate: [codex]
  research.journal-profile: [agy, codex]
  research.reviewer: codex-review
  research.submitter: codex-paper
  research.outline: codex-paper
  research.draft-authors: [codex-paper]
  research.consistency: codex-review
