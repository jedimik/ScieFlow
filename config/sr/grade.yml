version: 1
id: grade
name: "GRADE: certainty of a body of evidence"
source:
  citation: "Guyatt GH, Oxman AD, Vist GE, et al. GRADE: an emerging consensus on rating quality of evidence and strength of recommendations. BMJ 2008;336:924-926. Balshem H, Helfand M, Schunemann HJ, et al. GRADE guidelines: 3. Rating the quality of evidence. J Clin Epidemiol 2011;64:401-406."
  doi: null
verification:
  status: unverified
  note: "Written from the citations in plan 5.10 of M-H. Domains and points are not checked against the published guidance by a person; the DOIs are left null because they were not verified."
  verified_by: null
  verified_at: null
starting: {randomised: 4, non-randomised: 2}
certainty: [very low, low, moderate, high]
downgrade:
