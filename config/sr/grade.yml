    levels: {none: 0, serious: 1, very-serious: 2}
  - id: inconsistency
    label: "Inconsistency"
    levels: {none: 0, serious: 1, very-serious: 2}
  - id: indirectness
    label: "Indirectness"
    levels: {none: 0, serious: 1, very-serious: 2}
  - id: imprecision
    label: "Imprecision"
    levels: {none: 0, serious: 1, very-serious: 2}
  - id: publication-bias
    label: "Publication bias"
    levels: {none: 0, serious: 1, very-serious: 2}
upgrade:
  - id: large-effect
    label: "Large effect"
    levels: {none: 0, large: 1, very-large: 2}
  - id: dose-response
    label: "Dose-response gradient"
    levels: {none: 0, present: 1}
