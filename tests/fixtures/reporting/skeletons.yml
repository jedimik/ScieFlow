# M-D1 planning artifact (card t_7b40c299, 2026-10-27): reporting-guideline checklist SKELETONS.
# Ticket t2 turns each entry of `guidelines` into config/reporting/<id>.yml (plan section 5.3), copying
# id, name, version, applies_to, source, items exactly; every file gets verification.status: unverified.
#
# HONEST STATUS: written by the planner from knowledge, offline. Item ids follow the official checklists'
# numbering as the planner knows it; `topic` is a short neutral label in ScieFlow's own words, NOT the
# official item text. DOIs were not resolved (no network in planning). Nothing here may be presented as
# verified until a human checks the file against the official checklist named in `source` and records it
# (verification.status: verified, verified_by, verified_at). TRIPOD+AI and SPIRIT 2013 carry top-level
# items only (granularity: top-level). CONSORT 2025 and SPIRIT 2025 updates exist and are NOT included
# (plan residual R4).
#
# sections: title | abstract | introduction | methods | results | discussion | other
# evidence: statement | number | table | figure | diagram | registration
