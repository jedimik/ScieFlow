[project]
name = "scieflow"
version = "0.1.0"
description = "Agent-driven research loop coupling ExperimentX experiments with ResearchX literature support"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
norecursedirs = ["vendors"]
