[project]
name = "scieflow"
version = "0.1.0"
description = "Agent-driven research loop coupling ExperimentX experiments with ResearchX literature support"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]
# Optional: the claim-check module (scripts/nblm/). Install with
#   uv sync --group notebooklm
# Pinned below 0.9 because the dist is renamed to gemini-notebook-py there.
notebooklm = ["notebooklm-py>=0.8,<0.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
norecursedirs = ["vendors"]
