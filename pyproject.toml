[project]
name = "scieflow"
version = "0.2.0"
description = "Agent-driven research framework: computational experiments and literature research in one research loop"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "click>=8.1", "ruamel.yaml>=0.18", "questionary>=2.0"]

[project.optional-dependencies]
# Experiments module (scieflow.experiments): campaigns, sweeps, metrics, reports.
experiments = [
    "numpy>=1.26",
    "scikit-image>=0.22",
    "imageio>=2.34",
    "matplotlib>=3.8",
]
# Research module (scieflow.research): literature search, validation, Zotero.
research = [
    "requests>=2.31",
    "jsonschema>=4.21",
]
# News module (scieflow.news): track what changed in tools and topics you follow.
news = [
    "tinydb>=4.8",
    "filelock>=3.12",
]
# Chats module (scieflow.chats): selective backup/restore of agent chat stores.
chats = [
    "jsonschema>=4.21",
]
# Local web GUI for the news module (`scieflow news gui`).
news-gui = [
    "tinydb>=4.8",
    "filelock>=3.12",
    "nicegui>=2.0",
]

[project.scripts]
scieflow = "scieflow.cli:main"
# Legacy names from before the module merge; they print the new command and
# delegate (src/scieflow/core/legacy.py, docs/MIGRATION.md).
expx = "scieflow.core.legacy:expx_main"
whatsnew = "scieflow.core.legacy:whatsnew_main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "pytest-asyncio>=0.23"]
docs = ["mkdocs-material>=9.5"]
# Optional: the claim-check module (scripts/nblm/). Install with
#   uv sync --group notebooklm
# Pinned below 0.9 because the dist is renamed to gemini-notebook-py there.
notebooklm = ["notebooklm-py>=0.8,<0.9"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scieflow"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-m 'not slow and not live' --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# nicegui.testing user plugin: GUI tests build pages in-process, no main.py
main_file = ""
# main_file is only known once the nicegui plugin loads (GUI test modules)
# (regex "." stands in for the colon, which the filter syntax reserves)
filterwarnings = ["ignore:Unknown config option. main_file:pytest.PytestConfigWarning"]
markers = [
    "slow: requires apptainer container builds",
    "live: invokes a real agent CLI (spends quota; run explicitly with -m live)",
]
