# Decisions the protocols require. `requires_human: true` blocks in every mode —
# in an autonomous run the coordinator may answer only the others, only when it
# opened them as in-scope, and only with a recorded rationale.
kinds:
  campaign-approval:   {requires_human: false, help: "Run a proposed experiment campaign"}
  outline-approval:    {requires_human: false, help: "Draft from this paper outline"}
  staffing:            {requires_human: false, help: "Which agents do which roles for this run"}
  question:            {requires_human: false, help: "A clarifying question with no side effects"}
  claim-check-consent: {requires_human: true,  help: "Spend the user's NotebookLM quota on a claim audit"}
  upload:              {requires_human: true,  help: "Push data or chats to remote storage"}
  external-sharing:    {requires_human: true,  help: "Send content to an external service"}
  tier-promotion:      {requires_human: true,  help: "Let a support agent act as primary for a role"}
  scope-change:        {requires_human: true,  help: "Leave the approved question, scope or bounds"}
  budget-extension:    {requires_human: true,  help: "Raise a budget limit"}
  charter-adoption:    {requires_human: true,  help: "Adopt a proposed plan as this run's charter"}
  # Draft review (docs/research/review-contract.md). review-decision is answered
  # by the coordinator only when the run sets `review_decisions: coordinator`.
  review-decision:     {requires_human: false, help: "Accept, reject or defer each review-matrix comment"}
  review-blocker:      {requires_human: true,  help: "A retracted or unresolvable reference blocks merge: fix or overrule"}
  scite-consent:       {requires_human: true,  help: "Send this run's sanitised query plan to scite"}
  # Gap discovery (src/scieflow/research/skills/gap-discovery/SKILL.md, step 11).
  hypothesis-selection: {requires_human: true, help: "Pick the hypotheses paper-draft carries forward"}
  # Data protection (docs/data-protection.md, M-B 5.8): a checked file leaves an L2 run only on a human release.
  data-release:        {requires_human: true,  help: "Release a checked aggregate from a run"}
  # Study design (docs/experiments/design.md, M-D1 5.5): a locked design and its amendments are human-only.
  design-lock:         {requires_human: true,  help: "Lock or amend a run's study design and analysis plan"}
  # Journal guidelines (M-F 5.4): the human chooses which author-guideline pages a run may fetch;
  # only that answer lets the Gateway reach their hosts.
  journal-sources:     {requires_human: true,  help: "Fetch these author-guideline pages for a journal run"}
states: [open, answered, withdrawn]
